name: Build iPhone Cam IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project iPhoneCam.xcodeproj \
            -scheme iPhoneCam \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            -derivedDataPath /tmp/DerivedData \
            build

      - name: Package IPA
        run: |
          APP=$(find /tmp/DerivedData -name "*.app" -path "*Release-iphoneos*" | head -1)
          echo "Found app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found. Checking DerivedData structure:"
            find /tmp/DerivedData -name "*.app" 2>/dev/null | head -20
            exit 1
          fi
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp && zip -r "$GITHUB_WORKSPACE/ios/iPhoneCam.ipa" Payload/
          echo "IPA size: $(du -h "$GITHUB_WORKSPACE/ios/iPhoneCam.ipa" | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneCam-build-${{ github.run_number }}
          path: ios/iPhoneCam.ipa
          if-no-files-found: error
          retention-days: 30
