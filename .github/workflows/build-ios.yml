name: Build iPhone Cam IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project iPhoneCam.xcodeproj \
            -scheme iPhoneCam \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            -derivedDataPath /tmp/DerivedData \
            build 2>&1

      - name: Package IPA
        run: |
          APP=$(find /tmp/DerivedData -name "*.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find /tmp/DerivedData -name "*.app" | grep -v simulator | head -1)
          fi
          echo "Found app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found"
            find /tmp/DerivedData -name "*.app" 2>/dev/null
            exit 1
          fi
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp && zip -r "$GITHUB_WORKSPACE/ios/iPhoneCam.ipa" Payload/
          echo "IPA size: $(du -h "$GITHUB_WORKSPACE/ios/iPhoneCam.ipa" | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneCam-build-${{ github.run_number }}
          path: ios/iPhoneCam.ipa
          if-no-files-found: error
          retention-days: 30
